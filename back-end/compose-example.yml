version: "3.9"

services:
  db:
    image: # name of image
    environment:
      POSTGRES_USER: #postgres user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: #db name
    ports:
      - "5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schemas/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U name-of-database"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads: